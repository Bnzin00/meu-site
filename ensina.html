<style>

/* tutorial */
.th{border-radius:24px;padding:22px;background:#0e1d22;color:#e5f5f2;border:1px solid rgba(94,234,212,.15)}.th h1{margin-top:.5em}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px}.meta div{background:rgba(255,255,255,.05);border-radius:14px;padding:10px 12px;font-size:.88em;color:#9fbfba}.meta b{display:flex;gap:6px;align-items:center;color:#6ee7b7;font:700 .78em var(--f1);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}

.mod>div{background:var(--bg);border:1px solid var(--ln);border-radius:24px;padding:26px;max-width:440px;width:100%;text-align:center;animation:up .4s cubic-bezier(.2,.8,.2,1)}
.cm{width:76px;height:76px}.cm circle,.cm path{fill:none;stroke:var(--ac2);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.cm circle{stroke-dasharray:152;stroke-dashoffset:152;animation:dr .7s forwards}.cm path{stroke-width:4;stroke-dasharray:50;stroke-dashoffset:50;animation:dr .5s .45s forwards}@keyframes dr{to{stroke-dashoffset:0}}

#app.on{flex-direction:column;padding:10px}

<body>

const F={
fu1:{time:'3 a 5 horas',cost:'Nenhum para estudar. Ferramentas de IA têm planos gratuitos e pagos; confirme no site oficial.',know:'Nenhum conhecimento técnico.',
learn:['Explicar com suas palavras o que é inteligência artificial','Diferenciar IA que classifica e prevê de IA generativa','Entender, de forma simples, como um modelo aprende','Reconhecer limitações, erros e riscos','Testar uma ferramenta com segurança e conferir o que ela responde'],
gloss:[['Modelo','Programa treinado com dados para reconhecer padrões e produzir resultados.'],['Treinamento','Fase em que o modelo se ajusta ao analisar muitos exemplos.'],['IA generativa','Tipo de IA que cria conteúdo novo, como texto, imagem ou áudio.'],['Prompt','Pedido ou instrução que você escreve para a IA.'],['Alucinação','Resposta que parece correta, mas traz informação inventada ou errada.'],['Viés','Distorção nos resultados causada por limitações ou desequilíbrios nos dados.']],
tools:[['Elements of AI','https://www.elementsofai.com','curso gratuito de introdução à IA; útil nas etapas 1 a 3.'],['Claude','https://claude.ai','assistente de IA para testar na etapa 5 (há plano gratuito e planos pagos).'],['ChatGPT','https://chatgpt.com','outro assistente para comparar respostas na etapa 5.'],['Gemini','https://gemini.google.com','assistente do Google, também útil para comparar na etapa 5.']],
intro:'Inteligência artificial (IA) é a área da computação dedicada a criar sistemas capazes de executar tarefas que normalmente dependem da inteligência humana, como reconhecer fala, classificar imagens, traduzir idiomas ou redigir textos. Na prática, a maior parte das aplicações atuais usa aprendizado de máquina: em vez de seguir regras escritas passo a passo, o sistema se ajusta a partir de muitos exemplos. Este guia apresenta o assunto sem exigir conhecimento técnico, mostra o que essas ferramentas fazem bem, onde falham e como usá-las com responsabilidade.',
prep:'Você vai precisar de um navegador, um e-mail e de três a cinco horas, que podem ser divididas em dias diferentes. Muitas ferramentas oferecem planos gratuitos e pagos, com limites de uso que mudam com o tempo; confira sempre no site oficial. Antes de testar qualquer ferramenta, decida o que você não vai compartilhar: senhas, documentos de identidade, dados bancários e informações confidenciais do trabalho.',
steps:[
{t:'Entender o que é inteligência artificial',w:'Sem uma base clara, é fácil acreditar em promessas exageradas ou ter medo do que não se entende.',x:['IA não é uma entidade única nem um cérebro digital. É um conjunto de técnicas que permite a um programa executar tarefas associadas à inteligência, como reconhecer padrões, classificar informações ou gerar linguagem.','Boa parte dos sistemas atuais usa aprendizado de máquina. Em vez de um programador escrever todas as regras, o sistema recebe muitos exemplos e ajusta seu funcionamento para acertar mais. Um filtro de spam, por exemplo, aprende a partir de milhares de e-mails já marcados como spam ou não spam.'],a:['Anote três situações do seu dia em que você já usou algo com IA, como corretor de texto, recomendação de vídeos ou tradutor','Escreva, em duas frases, o que é IA sem usar termos técnicos'],ex:'Quando o aplicativo de música sugere uma playlist, ele compara seu histórico com o de outras pessoas e prevê o que você pode gostar. Ele não entende música: reconhece padrões.',e:'Imaginar que a IA pensa, sente ou entende o mundo como uma pessoa.',d:'Se você consegue explicar o conceito a alguém da sua família, entendeu o essencial.',ok:'Explico com minhas palavras o que é IA e cito dois exemplos do cotidiano.'},
{t:'Conhecer os principais tipos de IA',w:'Cada tipo serve a um objetivo e tem riscos próprios. Saber qual você está usando ajuda a escolher bem.',x:['Existem sistemas que classificam ou preveem, como antifraude de cartão, reconhecimento de voz e recomendações. Eles analisam dados e devolvem uma decisão, uma nota ou uma categoria.','A IA generativa cria conteúdo novo a partir de um pedido: textos, imagens, áudio, código. É a que mais apareceu nos últimos anos em assistentes de conversa e geradores de imagem. Ela produz respostas plausíveis, o que não significa que estejam corretas.'],a:['Monte uma tabela simples com duas colunas: “IA que classifica ou prevê” e “IA generativa”','Preencha cada coluna com três exemplos que você conhece'],ex:'Um banco que bloqueia uma compra suspeita usa IA que classifica. Um assistente que escreve um e-mail para você usa IA generativa.',e:'Tratar todo software moderno como se fosse IA generativa.',d:'Ao conhecer uma ferramenta nova, pergunte: ela decide, prevê ou cria?',ok:'Sei diferenciar IA que classifica de IA generativa e dou exemplos de cada.'},
{t:'Entender como um modelo aprende',w:'Entender o processo explica por que a IA acerta muito em alguns casos e falha em outros.',x:['O caminho é: reunir dados, treinar o modelo, avaliar e só então usar. No treinamento, o modelo ajusta milhões de parâmetros internos para errar menos nos exemplos que recebe. Depois de treinado, ele aplica o que aprendeu a pedidos novos.','Um modelo de linguagem aprende padrões entre palavras e calcula qual continuação é mais provável para um texto. Por isso escreve de forma fluente, mas pode afirmar algo falso com a mesma confiança. Ele também só conhece o que estava nos dados de treinamento, que têm uma data limite.'],a:['Pergunte a um assistente sobre um assunto muito específico da sua cidade ou profissão e observe a precisão','Leia o módulo introdutório do curso Elements of AI sobre aprendizado de máquina'],ex:'Se os dados de treino quase não tinham textos sobre uma região, o modelo tende a responder de forma genérica sobre ela.',e:'Achar que o modelo consulta a internet em tempo real. Algumas ferramentas têm busca, outras não.',d:'Nas configurações da ferramenta, verifique se há busca na web ou apenas conhecimento do treinamento.',ok:'Explico em poucas frases como um modelo é treinado e por que isso limita as respostas.'},
{t:'Reconhecer limitações e riscos',w:'O uso seguro depende de saber onde a IA costuma falhar.',x:['As limitações mais comuns são: alucinações (informação inventada), vieses (distorções herdadas dos dados), desatualização, dificuldade com cálculos e detalhes precisos, e sensibilidade à forma como você pergunta.','Também existem riscos para quem usa: exposição de dados pessoais, dependência excessiva, desinformação e uso de conteúdo sem checar direitos autorais. Em temas de saúde, direito e finanças, a IA não substitui um profissional.'],a:['Peça a um assistente uma citação de livro ou lei e procure a referência em fonte oficial para ver se existe','Registre um erro ou imprecisão que você encontrar'],ex:'Um assistente pode citar um artigo científico com título e autores convincentes que, ao serem buscados, não existem.',e:'Copiar nomes, números, datas e referências sem verificar.',d:'Quanto maior o impacto de uma decisão, maior deve ser a checagem.',ok:'Cito pelo menos quatro limitações ou riscos da IA e sei dar um exemplo de cada.'},
{t:'Testar uma ferramenta com segurança',w:'A prática transforma o conceito em experiência e mostra, na hora, o que funciona.',x:['Escolha um assistente e use, no começo, tarefas de baixo risco: explicar um conceito, sugerir um roteiro de estudos, reescrever um texto seu. Evite dados pessoais, documentos de trabalho e qualquer informação sigilosa.','Antes de usar, leia a política de privacidade e procure as configurações de histórico e de uso de conversas para treinamento. Planos, limites e regras mudam com frequência, então confirme no site oficial.'],a:['Crie uma conta ou use a versão gratuita de uma ferramenta','Faça três pedidos diferentes e anote o que foi útil e o que foi fraco','Compare a mesma pergunta em duas ferramentas'],ex:'Pedir “explique juros compostos para um adolescente” é uma tarefa segura. Colar um contrato com dados de clientes não é.',e:'Colar informações pessoais ou confidenciais “só para testar”.',d:'Crie o hábito de apagar dados sensíveis do texto antes de enviar, mesmo quando a ferramenta parece segura.',ok:'Fiz testes em pelo menos uma ferramenta e anotei os resultados sem expor dados sensíveis.'},
{t:'Conferir as respostas',w:'Conferir é o que separa quem usa IA com proveito de quem apenas repete erros.',x:['Um método simples: separe as afirmações que podem ser verificadas (dados, datas, nomes, leis), procure cada uma em uma fonte primária ou oficial e compare. Pedir fontes à própria IA ajuda, mas elas também precisam ser verificadas, porque podem não existir.','Desconfie quando a resposta for muito certa sobre assunto polêmico, trouxer números sem origem ou evitar dizer que não sabe. Para temas importantes, cruze duas fontes independentes.'],a:['Pegue uma resposta que você recebeu e sublinhe três afirmações verificáveis','Procure cada uma em um site oficial ou em fonte confiável'],ex:'Se a IA afirma que uma lei foi aprovada em certa data, confirme no site do órgão oficial antes de usar a informação.',e:'Considerar uma resposta correta só porque está bem escrita.',d:'Pedir “diga o que você não tem certeza” ajuda a revelar partes frágeis, mas não substitui a checagem.',ok:'Verifiquei pelo menos três afirmações de uma resposta de IA em fontes confiáveis.'},
{t:'Criar suas regras pessoais de uso',w:'Regras claras evitam decisões ruins no improviso e protegem seus dados.',x:['Reúna o que você aprendeu em uma lista curta. Inclua o que nunca será compartilhado, quando a checagem é obrigatória, em quais assuntos você não usará IA sem um profissional e como vai informar o uso quando for exigido na escola ou no trabalho.','Revise a lista de tempos em tempos. Ferramentas, políticas e riscos mudam, e suas regras devem acompanhar.'],a:['Escreva de 5 a 7 regras em um arquivo ou caderno','Releia a lista antes de usar uma ferramenta nova'],ex:'Regra possível: “Nunca envio senhas, documentos ou dados de clientes. Sempre confiro números e leis em fonte oficial.”',e:'Criar regras vagas demais, como “ter cuidado”.',d:'Regras específicas e curtas são mais fáceis de seguir.',ok:'Tenho uma lista escrita com pelo menos cinco regras pessoais de uso.'}],
ex:'Exemplo hipotético: Carla pede a um assistente que explique juros compostos, confere a resposta em um site oficial de educação financeira e percebe um detalhe impreciso. Desde então, ela só usa números de IA depois de checar.',
next:'Pratique com tarefas simples, avance para o guia “Escrever seus primeiros prompts” e leia sobre privacidade antes de usar IA em assuntos pessoais ou de trabalho. Volte a este guia sempre que quiser revisar as regras.'},
pr1:{time:'3 a 5 horas',cost:'Baixo: dá para praticar com planos gratuitos; confirme limites nos sites oficiais.',know:'Ter testado um assistente de IA.',
learn:['Montar pedidos com objetivo, contexto e formato','Usar exemplos para mostrar o resultado esperado','Corrigir respostas com ajustes específicos','Dividir tarefas complexas em etapas','Criar uma biblioteca pessoal de bons pedidos'],
gloss:[['Prompt','Texto com o pedido ou a instrução enviada à IA.'],['Contexto','Informações de apoio, como quem você é, o público e o objetivo.'],['Iteração','Repetir o pedido com ajustes até chegar ao resultado desejado.'],['Few-shot','Técnica de incluir um ou mais exemplos no pedido para orientar o resultado.'],['Formato de saída','Como você quer a resposta: lista, tabela, e-mail, tamanho e tom.'],['Alucinação','Resposta que parece correta, mas traz informação inventada ou errada.']],
tools:[['Claude','https://claude.ai','assistente para praticar os pedidos; etapas 2 a 6.'],['ChatGPT','https://chatgpt.com','alternativa para comparar resultados; etapas 2 a 6.'],['Gemini','https://gemini.google.com','alternativa para comparar resultados; etapas 2 a 6.'],['Guia de prompts (Anthropic)','https://docs.claude.com/en/docs/build-with-claude/prompt-engineering/overview','documentação oficial, em inglês, com técnicas de prompts; etapa 7.']],
intro:'Prompt é o pedido que você escreve para uma IA. Pedidos vagos geram respostas vagas; pedidos claros, com objetivo, contexto e formato, tendem a gerar respostas mais úteis. Este guia ensina um método simples e repetível, que funciona em diferentes ferramentas, para escrever, testar e melhorar seus pedidos.',
prep:'Tenha acesso a um assistente de IA e uma tarefa real e simples, como resumir um texto seu ou organizar uma lista de estudos. Reserve de três a cinco horas, que podem ser divididas. Evite colocar dados pessoais ou confidenciais nos testes.',
steps:[
{t:'Entender o que é um prompt',w:'A forma do pedido muda o resultado. Entender isso é o primeiro passo para melhorar.',x:['A IA responde ao que você escreve e ao contexto da conversa. Ela não adivinha o que você tem em mente. Se o pedido deixa lacunas, ela preenche com suposições, que muitas vezes não combinam com o que você queria.','Por isso, escrever um bom prompt é, na prática, comunicar bem: dizer o que se quer, para quem, em que formato e com que limites.'],a:['Escolha uma tarefa simples e escreva um pedido de uma linha','Envie e guarde a resposta para comparar mais tarde'],ex:'“Fale sobre alimentação saudável” é um pedido amplo. A resposta tende a ser genérica.',e:'Esperar que a IA descubra sozinha seu objetivo.',d:'Guarde essa primeira resposta. Ela será seu ponto de comparação ao final.',ok:'Tenho um pedido inicial e a resposta correspondente salvos.'},
{t:'Definir o objetivo e o público',w:'Sem objetivo, a resposta não tem direção. Sem público, o nível de linguagem fica errado.',x:['Responda a duas perguntas antes de escrever: o que eu quero receber e para quem. O objetivo pode ser um resumo, uma lista de ideias, um e-mail, uma explicação passo a passo. O público define o vocabulário e a profundidade.','Escreva o objetivo em uma frase. Se não couber em uma frase, a tarefa provavelmente precisa ser dividida.'],a:['Complete: “Quero [resultado] para [público]”','Reescreva seu pedido inicial incluindo essa frase'],ex:'“Quero uma explicação de alimentação saudável para um adolescente que pratica futebol.”',e:'Misturar vários objetivos em um único pedido.',d:'Se o resultado vai ser usado por outras pessoas, diga isso no pedido.',ok:'Meu pedido deixa claro o resultado esperado e o público.'},
{t:'Dar contexto relevante',w:'Contexto reduz suposições e aproxima a resposta da sua realidade.',x:['Inclua apenas informações que mudam a resposta: seu nível de conhecimento, restrições (tempo, orçamento), o que você já tentou, o tom desejado. Contexto demais, ou sem relação com o pedido, atrapalha.','Cuidado com a privacidade: use descrições gerais em vez de nomes, endereços ou documentos reais.'],a:['Acrescente duas ou três informações de contexto ao seu pedido','Troque qualquer dado pessoal por uma descrição geral'],ex:'“Tenho 30 minutos por dia e pouco dinheiro para suplementos; já tentei dietas restritivas e desisti.”',e:'Colar documentos inteiros ou dados sensíveis sem necessidade.',d:'Pergunte-se: essa informação mudaria a resposta? Se não, deixe de fora.',ok:'Meu pedido traz contexto útil e nenhum dado pessoal.'},
{t:'Especificar formato, tamanho e tom',w:'Dizer como você quer a resposta economiza tempo de reescrita.',x:['Informe o formato (lista, tabela, e-mail, roteiro), o tamanho (três parágrafos, até 150 palavras) e o tom (formal, direto, acolhedor). Quanto mais específico, menos ajustes serão necessários.','Se a resposta vai ser usada em outro lugar, peça já no formato final, para evitar retrabalho.'],a:['Acrescente ao pedido formato, tamanho e tom','Compare com a resposta da etapa 1'],ex:'“Responda em uma lista de cinco itens curtos, com linguagem simples e um exemplo prático em cada.”',e:'Pedir “resumido” sem dizer quanto.',d:'Números ajudam mais que adjetivos: “três parágrafos” é mais claro que “curto”.',ok:'Meu pedido define formato, tamanho e tom.'},
{t:'Usar exemplos',w:'Um exemplo vale mais que uma explicação longa para mostrar o que você espera.',x:['Mostrar um ou dois exemplos do resultado desejado orienta o estilo, a estrutura e o nível de detalhe. Essa técnica é chamada de few-shot, ou “poucos exemplos”.','Os exemplos devem ser parecidos com o que você quer. Se forem muito diferentes, a IA pode copiar detalhes que não importam.'],a:['Escreva um exemplo do resultado que você espera','Inclua o exemplo no pedido e compare o resultado'],ex:'“Quero títulos para posts neste estilo: ‘Três erros ao estudar para provas’. Crie mais cinco sobre organização de tempo.”',e:'Dar exemplos longos demais ou contraditórios.',d:'Use exemplos curtos e coerentes entre si.',ok:'Usei pelo menos um exemplo e vi a diferença no resultado.'},
{t:'Pedir ajustes e dividir tarefas',w:'A primeira resposta raramente é a final. O ajuste é parte do método.',x:['Em vez de recomeçar, diga o que mudar: mais simples, mais curto, com outro exemplo, sem termos técnicos. Pedidos de ajuste específicos funcionam melhor que “melhore isso”.','Em tarefas complexas, divida em etapas: primeiro peça um plano, depois desenvolva cada parte. Isso facilita conferir o resultado.'],a:['Faça dois pedidos de ajuste na mesma conversa','Divida uma tarefa grande em três etapas e execute uma por vez'],ex:'“Mantenha a estrutura, mas troque o exemplo 2 por algo ligado a trabalho e reduza o item 4 pela metade.”',e:'Pedir várias mudanças pouco claras de uma vez.',d:'Mude uma coisa por vez quando quiser entender o efeito de cada ajuste.',ok:'Melhorei uma resposta com pelo menos dois ajustes específicos.'},
{t:'Conferir, avaliar e montar sua biblioteca',w:'Conferir evita erros e guardar bons pedidos economiza tempo nas próximas vezes.',x:['Confira fatos, números e referências em fontes confiáveis antes de usar a resposta. Compare a versão final com a da etapa 1 e anote o que mais melhorou.','Guarde os pedidos que funcionaram em um arquivo, com uma breve descrição do uso. Adapte-os trocando as partes variáveis, como tema, público e tamanho.'],a:['Verifique duas informações da resposta final','Salve seu melhor pedido com uma nota sobre quando usá-lo'],ex:'Modelo reutilizável: “Quero [resultado] para [público]. Contexto: [dados]. Formato: [formato]. Tom: [tom].”',e:'Reutilizar um pedido sem adaptar ao novo contexto.',d:'Revise sua biblioteca de vez em quando e apague o que não funciona mais.',ok:'Tenho um pedido modelo salvo e uma resposta conferida.'}],
ex:'Exemplo hipotético: em vez de “explique inflação”, Paulo escreve “explique inflação em três parágrafos curtos para um adolescente, com um exemplo do dia a dia”. A resposta fica mais útil e ele pede um ajuste para simplificar o último parágrafo.',
next:'Pratique com tarefas variadas, estude técnicas como pedir raciocínio em etapas, e continue conferindo as informações importantes. Use a biblioteca de pedidos como ponto de partida e refine com o tempo.'}};

function load(){$('#wel').classList.remove('on');$('#ld').classList.add('on');const Ph=['Obrigado pela preferência! Estamos preparando tudo para você.','Está tudo bem com você?','Organizando seus guias...','Preparando sua experiência...','Seu próximo aprendizado está chegando!'],ph=$('#ph'),T0=performance.now(),DUR=2800;let k=-1;
(function f(now){const x=Math.min(1,(now-T0)/DUR),e=x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2,p=Math.round(e*100);$('#lb').style.width=p+'%';$('#lp').textContent=p+'%';const n=Math.min(Ph.length-1,Math.floor(x*Ph.length));if(n!=k){k=n;ph.classList.remove('sw');void ph.offsetWidth;ph.textContent=Ph[n];ph.classList.add('sw')}if(x<1)requestAnimationFrame(f);else setTimeout(()=>{$('#ld').classList.remove('on');$('#app').classList.add('on');render()},350)})(T0)}

function ctx(){let c='o aluno está na tela "'+t('n')[V.view]+'"';if(V.tut&&F[V.tut]){const f=F[V.tut],p=S.prog[V.tut],j=p?f.steps.findIndex((_,i)=>!p.done[i]):0;c+=`; tutorial: "${tt(V.tut).t}" (${V.open?'aberto':'na tela de confirmação'}); ${p?f.steps.filter((_,i)=>p.done[i]).length:0} de ${f.steps.length} etapas concluídas`;if(V.open&&j>=0){const s=f.steps[j];c+=`; etapa atual: "${s.t}". Resumo da etapa: ${s.x[0]}`}}return c}
async function send(q){q=q.trim();if(!q)return;$('#ain').value='';msg('u',q);HIST.push({role:'user',content:q});const w=msg('l','Lumi está digitando…');let r=null;
if(SM&&AIOK){try{const sys='Você é a Lumi, assistente de ajuda do ensInA, um site educativo para iniciantes. Responda sempre em português do Brasil, de forma clara, organizada e objetiva, em até 160 palavras, a menos que peçam mais. Explique termos técnicos com exemplos simples. Não invente fatos, preços, links ou resultados; se não souber, diga. Em temas de saúde, direito e finanças, lembre que a IA não substitui um profissional. Incentive a conferir informações importantes em fontes oficiais. Contexto da tela: '+ctx()+'. Conversa até aqui:';
const h=HIST.slice(-7).map(m=>({role:m.role,content:m.content}));const inp=[{role:'user',content:sys+'\n\n'+h.map(m=>(m.role=='user'?'Aluno: ':'Lumi: ')+m.content).join('\n')+'\n\nResponda à última pergunta do aluno.'}];
const o=await SM(inp,{cache:false,onText:({text})=>{w.textContent=text;$('#ailog').scrollTop=1e6}});r=(o&&o.text)||w.textContent}catch(e){if(e&&e.code=='not_granted'){AIOK=false;aiSt()}r=null}}
if(!r){try{r=local(q)}catch(e){r='Desculpe, não consegui responder agora. Tente novamente.'}}
w.textContent=r;HIST.push({role:'assistant',content:r});$('#ailog').scrollTop=1e6}
const KB=[[['progress','salv','navegador','dispositivo','perder'],'Seu progresso e seus guias salvos ficam guardados neste navegador (armazenamento local). Podem não aparecer em outro dispositivo ou se você limpar os dados do navegador.'],[['tema','escuro','claro','idioma','tamanho do texto','contraste','acessib','animac'],'Em Opções você muda aparência, idioma, tamanho do texto, redução de movimento e alto contraste.'],[['prompt','pedido','pedir','instruc','comando'],'Prompt é o pedido que você escreve para a IA. Defina o objetivo, dê contexto e informe o formato desejado. Depois peça ajustes específicos. O tutorial “Escrever seus primeiros prompts” explica esse método em sete etapas.'],[['alucin','invent','errad','mentir','confiavel','confiar'],'Modelos de IA podem inventar informações com muita confiança. Para dados, datas, leis e referências, confira em fontes oficiais antes de usar.'],[['privacid','dados pessoais','senha','segur','confidenc','sigilo','lgpd'],'Evite compartilhar senhas, documentos de identidade, dados bancários e informações confidenciais com ferramentas de IA. Leia a política de privacidade e as configurações de histórico antes de usar.'],[['vies','preconceit','discrimin'],'Vieses são distorções que o modelo pode herdar dos dados de treino. Avalie as respostas com senso crítico e compare fontes diferentes.'],[['treino','treinamento','aprende','como funciona','llm','modelo de linguagem'],'Um modelo é treinado com muitos exemplos e ajusta seus parâmetros internos para errar menos. Modelos de linguagem aprendem padrões entre palavras e calculam a continuação mais provável de um texto. Por isso soam fluentes, mas podem errar. O tutorial “O que é inteligência artificial, sem complicação” detalha isso na etapa 3.'],[['preco','custo','gratis','gratuito','pago','plano','assinatura'],'Muitas ferramentas têm planos gratuitos e pagos, com limites que mudam. Confirme sempre no site oficial de cada ferramenta.'],[['comec','inici','recomend','proximo','por onde','trilha','estudar'],'Abra o Guia e comece pelo Grupo A (iniciantes). Hoje há conteúdo completo em “O que é inteligência artificial, sem complicação” e “Escrever seus primeiros prompts”. A ordem sugerida é essa.'],[['conferir','verificar','checar','fonte','checagem'],'Separe as afirmações verificáveis (dados, datas, nomes, leis), procure cada uma em fonte oficial e compare com outra fonte independente. Pedir fontes à IA ajuda, mas elas também precisam ser verificadas.'],[['como o site','navegar','menu','meus guias','concluir','marcar etapa'],'No menu você acessa Início, Guia, Meus guias, IA de ajuda e Opções. Dentro de um tutorial, marque cada etapa ao concluí-la. O tutorial só é concluído quando você clica em “Marcar como concluído”, com todas as etapas feitas.'],[['trabalho','carreira','empresa','profissao','emprego'],'Antes de usar IA no trabalho, verifique as políticas da empresa, não envie dados confidenciais e revise tudo o que for produzido. Em decisões importantes, mantenha uma pessoa responsável.'],[['oi','ola','bom dia','boa tarde','boa noite'],'Olá! Como posso ajudar?']];
function local(q){const s=nz(q),o=V.tut&&V.open&&F[V.tut],f=o?F[V.tut]:null,p=o?S.prog[V.tut]:null;
if(f){const m=s.match(/(?:etapa|passo)\s*(\d+)/),j=p.done.findIndex(k=>!k);let i=m?+m[1]-1:/proxim|seguinte|depois/.test(s)?j:/etapa|passo|explic|entend|ajud/.test(s)?j:-1;if(i>=f.steps.length)i=-1;if(i>=0||(/etapa|passo|entend/.test(s)&&j<0)){if(i<0)return 'Você já marcou todas as etapas. Falta apenas clicar em “Marcar como concluído” no fim da página.';const e=f.steps[i];return `Etapa ${i+1}: ${e.t}.\n\n${e.w}\n\n${e.x[0]}\n\nNa prática: ${e.a.join('; ')}.\n\nCritério: ${e.ok}`}}
const g=GL.find(a=>s.includes(nz(a[0]))&&(a[0].length>3||new RegExp('\\b'+a[0]+'\\b').test(s)));if(g)return g[0][0].toUpperCase()+g[0].slice(1)+': '+g[1];
let b=null,bs=0;for(const [k,a] of KB){const n=k.filter(x=>s.includes(x)).length;if(n>bs){bs=n;b=a}}if(b)return b;
return 'Ainda não tenho uma resposta pronta para isso. Posso ajudar com o conteúdo dos tutoriais, termos como prompt, modelo e alucinação, privacidade, verificação de respostas e navegação do site. Tente perguntar de outra forma.'}
